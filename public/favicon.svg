<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" />
  
  <!-- Pen/Nib icon representing writing -->
  <g transform="translate(50, 50)">
    <!-- Pen body -->
    <path d="M -15 25 L -5 35 L 5 25 L 5 -25 L -5 -25 Z" 
          fill="#ffffff" 
          opacity="0.95"
          filter="url(#glow)"/>
    
    <!-- Pen tip -->
    <path d="M -5 35 L 0 40 L 5 35 L 5 25 L -5 25 Z" 
          fill="#ffffff" 
          opacity="0.9"/>
    
    <!-- Pen nib line -->
    <line x1="0" y1="-25" x2="0" y2="25" 
          stroke="#3b82f6" 
          stroke-width="1.5" 
          opacity="0.6"/>
  </g>
  
  <!-- Sparkles representing words/ideas -->
  <g opacity="0.9">
    <circle cx="30" cy="30" r="2.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="30" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="70" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="70" r="2.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Small accent dots -->
  <circle cx="20" cy="50" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="80" cy="50" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="50" cy="20" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="50" cy="80" r="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
